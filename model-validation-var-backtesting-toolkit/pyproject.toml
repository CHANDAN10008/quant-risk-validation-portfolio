[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-validation-var-backtesting-toolkit"
version = "1.0.0"
description = "Historical and parametric VaR forecasting with standard backtests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]

[project.scripts]
var-backtest = "var_validation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
